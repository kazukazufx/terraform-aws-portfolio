name: Deploy application

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  PROJECT_NAME: terraform-aws-portfolio
  ENVIRONMENT: dev
  ECR_REPOSITORY: terraform-aws-portfolio-dev
  ECS_CLUSTER: terraform-aws-portfolio-dev
  ECS_SERVICE: terraform-aws-portfolio-dev
  TASK_FAMILY: terraform-aws-portfolio-dev
  CONTAINER_NAME: app

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --requirement app/requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: python -m pytest

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_APP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6
      - name: Build and push immutable image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"
      - name: Register task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --query taskDefinition > current-task-definition.json
          jq --arg image "${IMAGE_URI}" --arg version "${GITHUB_SHA}" '
            .containerDefinitions[0].image = $image |
            .containerDefinitions[0].environment = (
              .containerDefinitions[0].environment |
              map(if .name == "APP_VERSION" then .value = $version else . end)
            ) |
            del(
              .taskDefinitionArn, .revision, .status, .requiresAttributes,
              .compatibilities, .registeredAt, .registeredBy
            )
          ' current-task-definition.json > next-task-definition.json
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://next-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "TASK_DEFINITION_ARN=${TASK_DEFINITION_ARN}" >> "${GITHUB_ENV}"
      - name: Discover Fargate network
        run: |
          PUBLIC_SUBNETS=$(aws ec2 describe-subnets \
            --filters \
              "Name=tag:Project,Values=${PROJECT_NAME}" \
              "Name=tag:Environment,Values=${ENVIRONMENT}" \
              "Name=tag:Tier,Values=public" \
            --query 'Subnets[].SubnetId' --output text | tr '\t' ',')
          ECS_SECURITY_GROUP=$(aws ec2 describe-security-groups \
            --filters \
              "Name=tag:Project,Values=${PROJECT_NAME}" \
              "Name=tag:Environment,Values=${ENVIRONMENT}" \
              "Name=tag:Name,Values=${PROJECT_NAME}-${ENVIRONMENT}-ecs" \
            --query 'SecurityGroups[0].GroupId' --output text)
          test -n "${PUBLIC_SUBNETS}"
          test "${ECS_SECURITY_GROUP}" != "None"
          echo "PUBLIC_SUBNETS=${PUBLIC_SUBNETS}" >> "${GITHUB_ENV}"
          echo "ECS_SECURITY_GROUP=${ECS_SECURITY_GROUP}" >> "${GITHUB_ENV}"
      - name: Run database migration
        run: |
          NETWORK="awsvpcConfiguration={subnets=[${PUBLIC_SUBNETS}],securityGroups=[${ECS_SECURITY_GROUP}],assignPublicIp=ENABLED}"
          OVERRIDES=$(jq -cn --arg name "${CONTAINER_NAME}" '{containerOverrides:[{name:$name,command:["alembic","-c","app/alembic.ini","upgrade","head"]}]}')
          MIGRATION_TASK=$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --task-definition "${TASK_DEFINITION_ARN}" \
            --launch-type FARGATE \
            --network-configuration "${NETWORK}" \
            --overrides "${OVERRIDES}" \
            --query 'tasks[0].taskArn' --output text)
          test "${MIGRATION_TASK}" != "None"
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${MIGRATION_TASK}"
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" --tasks "${MIGRATION_TASK}" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "${EXIT_CODE}" != "0" ]; then
            aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks "${MIGRATION_TASK}"
            exit 1
          fi
      - name: Deploy and start service
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${TASK_DEFINITION_ARN}" \
            --desired-count 1 > /dev/null
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"
